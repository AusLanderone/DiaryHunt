<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DiaryHunt</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      DiaryHunt
      <span class="brand-sub">арбитраж-дневник</span>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-journal">Журнал</button>
      <button class="tab" id="tab-stats">Статистика</button>
    </div>
    <div class="actions">
      <button class="btn icon" id="btn-settings" title="Настройки">⚙</button>
      <button class="btn ghost" id="btn-export">Экспорт CSV</button>
      <button class="btn primary" id="btn-add">Добавить сделку</button>
    </div>
  </header>
  <div id="view"></div>

  <script src="../src/calc.js"></script>
  <script src="../src/analytics.js"></script>
  <script src="format.js"></script>
  <script src="journal.js"></script>
  <script src="form.js"></script>
  <script src="stats.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
