<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DiaryHunt</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      DiaryHunt
      <span class="brand-sub">арбитраж-дневник</span>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-journal">Журнал</button>
      <button class="tab" id="tab-stats">Статистика</button>
      <button class="tab" id="tab-balances">Балансы</button>
    </div>
    <div class="actions">
      <button class="sync-badge" id="sync-badge" title="Синхронизация с облаком">
        <span class="dot"></span><span class="txt">…</span>
      </button>
      <button class="btn ghost settings-btn" id="btn-settings" title="Настройки, справочники, экспорт"><span class="gear">⚙</span>Настройки</button>
      <button class="btn primary" id="btn-add">Добавить сделку</button>
    </div>
  </header>
  <div id="view"></div>

  <script src="../src/calc.js"></script>
  <script src="../src/analytics.js"></script>
  <script src="../src/journalView.js"></script>
  <script src="../src/statsFilter.js"></script>
  <script src="../src/widgetRanges.js"></script>
  <script src="../src/widgetOrder.js"></script>
  <script src="../src/widgetSize.js"></script>
  <script src="../src/dicts.js"></script>
  <script src="../src/balances.js"></script>
  <script src="format.js"></script>
  <script src="pickers.js"></script>
  <script src="gridCards.js"></script>
  <script src="journal.js"></script>
  <script src="form.js"></script>
  <script src="stats.js"></script>
  <script src="balances.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
